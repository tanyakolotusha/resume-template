resume_header_intro: "<p>Customer-focused Associate Product Manager with a strong background in Customer Success, UX research, and cross-functional collaboration in fast-paced tech environments. Skilled at identifying user pain points, transforming feedback into actionable product requirements, and working closely with design and engineering to deliver impactful solutions. Known for high empathy, analytical thinking, and a proactive mindset. Currently seeking a product-focused role after recent company pivot toward sales.</p>"

