# Site settings
title: "TK Resume"
description: "TK Resume"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    Tetiana (Tanya) Kolotusha
